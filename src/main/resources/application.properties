# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

# Caching Configuration (TTL = 10 Minutes)
spring.cache.type=caffeine
spring.cache.cache-names=products
spring.cache.caffeine.spec=expireAfterWrite=10m,maximumSize=100

# Security (Requirement #3)
spring.security.user.name=admin
spring.security.user.password=password123


